<section class="change-password-page">
  <app-page-header title="Change password" subtitle="Update your account password.">
    <a class="btn btn--secondary" routerLink="/profile">Back to profile</a>
  </app-page-header>

  <app-ui-card title="Password">
    @if (errorMessage()) {
      <div class="alert alert--danger" role="alert">{{ errorMessage() }}</div>
    }
    @if (successMessage()) {
      <div class="alert alert--success" role="status">{{ successMessage() }}</div>
    }

    <form class="form-grid" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="form-field form-field--full">
        <span class="form-label">Current password</span>
        <input class="form-input" type="password" formControlName="currentPassword" autocomplete="current-password" />
      </label>
      <label class="form-field">
        <span class="form-label">New password</span>
        <input class="form-input" type="password" formControlName="newPassword" autocomplete="new-password" />
      </label>
      <label class="form-field">
        <span class="form-label">Confirm password</span>
        <input class="form-input" type="password" formControlName="confirmPassword" autocomplete="new-password" />
      </label>
      <div class="form-actions form-field--full">
        <button type="submit" class="btn btn--primary" [disabled]="submitting()">
          {{ submitting() ? 'Saving…' : 'Update password' }}
        </button>
      </div>
    </form>
  </app-ui-card>
</section>
