<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <h1>Forgot password</h1>
      <p>{{ appName }}</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert--danger" role="alert">{{ errorMessage() }}</div>
    }
    @if (successMessage()) {
      <div class="alert alert--success" role="status">{{ successMessage() }}</div>
    }
    @if (developmentResetToken()) {
      <div class="alert alert--success" role="status">
        Development reset token (dev only). Use it on the reset page.
        <a [routerLink]="['/reset-password']" [queryParams]="{ token: developmentResetToken() }">
          Continue to reset
        </a>
      </div>
    }

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="form-field">
        <span class="form-label">Tenant code</span>
        <input class="form-input" type="text" formControlName="tenantCode" autocomplete="organization" />
      </label>
      <label class="form-field">
        <span class="form-label">Username</span>
        <input class="form-input" type="text" formControlName="username" autocomplete="username" />
      </label>
      <button type="submit" class="btn btn--primary auth-form__submit" [disabled]="submitting()">
        {{ submitting() ? 'Submitting…' : 'Send reset link' }}
      </button>
    </form>

    <p class="auth-card__footer">
      <a routerLink="/login">Back to sign in</a>
    </p>
  </div>
</div>
