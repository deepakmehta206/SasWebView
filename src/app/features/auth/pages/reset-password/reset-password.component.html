<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <h1>Reset password</h1>
      <p>{{ appName }}</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert--danger" role="alert">{{ errorMessage() }}</div>
    }
    @if (successMessage()) {
      <div class="alert alert--success" role="status">{{ successMessage() }}</div>
    }

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="form-field">
        <span class="form-label">Reset token</span>
        <input class="form-input" type="text" formControlName="token" autocomplete="off" />
      </label>
      <label class="form-field">
        <span class="form-label">New password</span>
        <input class="form-input" type="password" formControlName="newPassword" autocomplete="new-password" />
      </label>
      <label class="form-field">
        <span class="form-label">Confirm password</span>
        <input class="form-input" type="password" formControlName="confirmPassword" autocomplete="new-password" />
      </label>
      <button type="submit" class="btn btn--primary auth-form__submit" [disabled]="submitting()">
        {{ submitting() ? 'Resetting…' : 'Reset password' }}
      </button>
    </form>

    <p class="auth-card__footer">
      <a routerLink="/login">Back to sign in</a>
    </p>
  </div>
</div>
