<section class="page">
  <app-page-header title="Departments">
    <ng-container *appHasPermission="permissionCodes.EmployeeEdit">
      <a class="btn btn--primary" routerLink="new">Add</a>
    </ng-container>
  </app-page-header>
  <app-ui-card title="Departments">
    @if (errorMessage()) {
      <div class="alert alert--danger">{{ errorMessage() }}</div>
    }
    @if (loading()) {
      <app-loading-indicator label="Loading…" />
    } @else if (!rows().length) {
      <app-empty-state title="No departments" message="Nothing found.">
        <button type="button" class="btn btn--secondary" (click)="load()">Retry</button>
      </app-empty-state>
    } @else {
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Name</th>
              <th>Branch</th>
              <th>Active</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            @for (row of rows(); track row.departmentId) {
              <tr>
                <td>{{ row.departmentCode }}</td>
                <td>{{ row.departmentName }}</td>
                <td>{{ row.branchId }}</td>
                <td>{{ row.isActive ? 'Yes' : 'No' }}</td>
                <td class="data-table__actions">
                  <ng-container *appHasPermission="permissionCodes.EmployeeEdit">
                    <a class="btn btn--secondary" [routerLink]="[row.departmentId, 'edit']">Edit</a>
                    <button
                      type="button"
                      class="btn btn--secondary"
                      [disabled]="statusBusyId() === row.departmentId"
                      (click)="toggleStatus(row)"
                    >
                      {{ row.isActive ? 'Deactivate' : 'Activate' }}
                    </button>
                  </ng-container>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
  </app-ui-card>
</section>
