<section class="page">
  <app-page-header [title]="(isEdit() ? 'Edit' : 'Add') + ' holiday'">
    <a class="btn btn--secondary" routerLink="/hrms/holidays">Back</a>
  </app-page-header>
  <app-ui-card title="Details">
    @if (errorMessage()) {
      <div class="alert alert--danger">{{ errorMessage() }}</div>
    }
    @if (loading()) {
      <app-loading-indicator label="Loading…" />
    } @else {
      <form class="form-grid" [formGroup]="form" (ngSubmit)="submit()">
        <label class="form-field">
          <span class="form-label">Branch (optional)</span>
          <select class="form-input" formControlName="branchId">
            <option [ngValue]="null">All branches</option>
            @for (branch of branches(); track branch.branchId) {
              <option [ngValue]="branch.branchId">{{ branch.branchCode }} — {{ branch.branchName }}</option>
            }
          </select>
        </label>
        <label class="form-field">
          <span class="form-label">Date</span>
          <input class="form-input" type="date" formControlName="holidayDate" />
        </label>
        <label class="form-field">
          <span class="form-label">Name</span>
          <input class="form-input" formControlName="holidayName" />
        </label>
        <label class="form-field">
          <span class="form-label">Type</span>
          <input class="form-input" formControlName="holidayType" />
        </label>
        <label class="form-check"><input type="checkbox" formControlName="isOptional" /><span>Optional</span></label>
        @if (isEdit()) {
          <label class="form-check"><input type="checkbox" formControlName="isActive" /><span>Active</span></label>
        }
        <div class="form-actions">
          <button class="btn btn--primary" type="submit" [disabled]="saving()">{{ saving() ? 'Saving…' : 'Save' }}</button>
        </div>
      </form>
    }
  </app-ui-card>
</section>
