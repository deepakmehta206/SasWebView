<section class="page">
  <app-page-header title="Item categories">
    <ng-container *appHasPermission="permissionCodes.InventoryItemManage">
      <a class="btn btn--primary" routerLink="new">Add</a>
    </ng-container>
  </app-page-header>
  <app-ui-card title="Categories">
    @if (errorMessage()) {
      <div class="alert alert--danger">{{ errorMessage() }}</div>
    }
    @if (loading()) {
      <app-loading-indicator label="Loading…" />
    } @else if (!rows().length) {
      <app-empty-state title="No categories" message="Nothing found.">
        <button type="button" class="btn btn--secondary" (click)="load()">Retry</button>
      </app-empty-state>
    } @else {
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Name</th>
              <th>Parent</th>
              <th>Active</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            @for (row of rows(); track row.categoryId) {
              <tr>
                <td>{{ row.categoryCode }}</td>
                <td>{{ row.categoryName }}</td>
                <td>{{ row.parentCategoryId ?? '—' }}</td>
                <td>{{ row.isActive ? 'Yes' : 'No' }}</td>
                <td class="data-table__actions">
                  <ng-container *appHasPermission="permissionCodes.InventoryItemManage">
                    <a class="btn btn--secondary" [routerLink]="[row.categoryId, 'edit']">Edit</a>
                    <button
                      type="button"
                      class="btn btn--secondary"
                      [disabled]="statusBusyId() === row.categoryId"
                      (click)="toggleStatus(row)"
                    >
                      {{ row.isActive ? 'Deactivate' : 'Activate' }}
                    </button>
                  </ng-container>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
  </app-ui-card>
</section>
