<section class="page">
  <app-page-header [title]="(isEdit() ? 'Edit' : 'Add') + ' item'">
    <a class="btn btn--secondary" routerLink="/inventory/items">Back</a>
  </app-page-header>
  <app-ui-card title="Details">
    @if (errorMessage()) {
      <div class="alert alert--danger">{{ errorMessage() }}</div>
    }
    @if (loading()) {
      <app-loading-indicator label="Loading…" />
    } @else {
      <form class="form-grid" [formGroup]="form" (ngSubmit)="submit()">
        <label class="form-field">
          <span class="form-label">Code</span>
          <input class="form-input" formControlName="itemCode" />
        </label>
        <label class="form-field">
          <span class="form-label">Name</span>
          <input class="form-input" formControlName="itemName" />
        </label>
        <label class="form-field form-field--full">
          <span class="form-label">Description</span>
          <input class="form-input" formControlName="description" />
        </label>
        <label class="form-field">
          <span class="form-label">Category</span>
          <select class="form-input" formControlName="categoryId">
            <option [ngValue]="null">None</option>
            @for (category of categories(); track category.categoryId) {
              <option [ngValue]="category.categoryId">{{ category.categoryName }}</option>
            }
          </select>
        </label>
        <label class="form-field">
          <span class="form-label">Brand</span>
          <select class="form-input" formControlName="brandId">
            <option [ngValue]="null">None</option>
            @for (brand of brands(); track brand.brandId) {
              <option [ngValue]="brand.brandId">{{ brand.brandName }}</option>
            }
          </select>
        </label>
        <label class="form-field">
          <span class="form-label">Unit of measure</span>
          <select class="form-input" formControlName="unitOfMeasureId">
            <option [ngValue]="0" disabled>Select UOM</option>
            @for (uom of uomOptions(); track uom.value) {
              <option [ngValue]="uom.value">{{ uom.label }}</option>
            }
          </select>
        </label>
        <label class="form-field">
          <span class="form-label">Item type</span>
          <select class="form-input" formControlName="itemType">
            <option [value]="itemTypes.Goods">Goods</option>
            <option [value]="itemTypes.Service">Service</option>
            <option [value]="itemTypes.Consumable">Consumable</option>
          </select>
        </label>
        <label class="form-field">
          <span class="form-label">Barcode</span>
          <input class="form-input" formControlName="barcode" />
        </label>
        <label class="form-field">
          <span class="form-label">SKU</span>
          <input class="form-input" formControlName="sku" />
        </label>
        <label class="form-field">
          <span class="form-label">Reorder level</span>
          <input class="form-input" type="number" formControlName="reorderLevel" />
        </label>
        <label class="form-field">
          <span class="form-label">Reorder quantity</span>
          <input class="form-input" type="number" formControlName="reorderQuantity" />
        </label>
        <label class="form-field">
          <span class="form-label">Cost price</span>
          <input class="form-input" type="number" step="0.01" formControlName="costPrice" />
        </label>
        <label class="form-field">
          <span class="form-label">Selling price</span>
          <input class="form-input" type="number" step="0.01" formControlName="sellingPrice" />
        </label>
        @if (isEdit()) {
          <label class="form-check"><input type="checkbox" formControlName="isActive" /><span>Active</span></label>
        }
        <div class="form-actions">
          <button class="btn btn--primary" type="submit" [disabled]="saving()">
            {{ saving() ? 'Saving…' : 'Save' }}
          </button>
        </div>
      </form>
    }
  </app-ui-card>
</section>
