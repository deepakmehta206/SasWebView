<section class="masters-hub">
  <app-page-header
    title="Masters"
    subtitle="Common master data. Tax master is not available in this release."
  />

  <div class="masters-hub__grid">
    @for (link of links; track link.route) {
      <a class="masters-hub__link" [routerLink]="link.route">
        <app-ui-card [title]="link.title">
          <p>{{ link.description }}</p>
        </app-ui-card>
      </a>
    }
  </div>
</section>
